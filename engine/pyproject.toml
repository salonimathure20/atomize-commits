[project]
name = "commit-splitter"
version = "0.1.0"
description = "Context-aware splitting of tangled working trees into atomic commits"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
phase2 = ["tree-sitter>=0.21", "tree-sitter-languages>=1.10", "networkx>=3.0"]

[project.scripts]
splitter = "splitter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
